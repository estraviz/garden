name: CI

on:
  pull_request:
    branches:
      - v4
      - "ver*"
  push:
    branches:
      - v4
      - "ver*"
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Check types and style
        run: npm run check

      - name: Build site
        run: npm run quartz -- build --bundleInfo
